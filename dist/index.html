<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #000;
    --text: #f5f5f7;
    --dim: #8e8e93;
    --faint: rgba(255, 255, 255, 0.08);
    --card: rgba(255, 255, 255, 0.055);
    --green: #30d158;
    --red: #ff453a;
    --yellow: #ffd60a;
    --brand-teal: #2db1b3;
    --brand-mint: #7ac793;
    --brand-gradient: linear-gradient(135deg, var(--brand-teal), var(--brand-mint));
    --spring: cubic-bezier(0.32, 1.28, 0.54, 1);
    --smooth: cubic-bezier(0.32, 0.72, 0, 1);
    --dur: 0.48s;
    --w: 200px;
    --h: 32px;
    --r: 12px;
    --ear: 8px;
    color-scheme: dark;
  }
  @font-face { font-family: "Outfit"; src: url("fonts/Outfit-Variable.ttf"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--text);
    font: 13px "Inter", "Noto Sans", "Ubuntu", "Cantarell", system-ui, sans-serif; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }
  svg { display: block; fill: currentColor; }

  #notch {
    position: absolute; top: 0; left: 50%; width: var(--w); height: var(--h); transform: translateX(-50%);
    background: var(--bg); border-radius: 0 0 var(--r) var(--r); cursor: pointer;
    transition: width var(--dur) var(--spring), height var(--dur) var(--spring), border-radius var(--dur) var(--smooth), box-shadow 0.4s ease;
  }
  #notch.open { cursor: default; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4); }
  body.away #notch { display: none; }

  .ear { position: absolute; top: 0; width: var(--ear); height: var(--ear); pointer-events: none; }
  .ear.left { left: calc(-1 * var(--ear) + 0.5px); background: radial-gradient(circle at 0 100%, transparent calc(var(--ear) - 0.5px), var(--bg) var(--ear)); }
  .ear.right { right: calc(-1 * var(--ear) + 0.5px); background: radial-gradient(circle at 100% 100%, transparent calc(var(--ear) - 0.5px), var(--bg) var(--ear)); }

  #glow {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
    background: radial-gradient(120% 90% at 12% 80%, rgba(255, 255, 255, 0.2), transparent 60%);
  }
  #notch.open.playing #glow { opacity: 1; }

  #closed { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; padding: 0 12px; gap: 6px; transition: opacity 0.2s ease; }
  #notch.open #closed, #notch.notify #closed { opacity: 0; pointer-events: none; transition-duration: 0.08s; }
  #closed .gap { flex: 1; }
  #closedArt { width: 20px; height: 20px; border-radius: 6px; object-fit: cover; display: none; }
  #notch.playing #closedArt { display: block; }
  #closedTimer { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; display: none; }
  #notch.timing #closedTimer { display: block; }
  #idleClock {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, 0.86);
  }

  #toast { position: absolute; inset: 0; padding: 0 18px; display: flex; align-items: center; gap: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  #toastIcon, .nf-icon { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--faint); font-weight: 700; font-size: 14px; }
  #toastIcon.brand, .nf-icon.brand { background: var(--brand-gradient); color: #fff; font-family: "Outfit", sans-serif; }
  .toast-text { min-width: 0; flex: 1; }
  #notch.notify #toast { opacity: 1; transition-delay: 0.12s; }
  #toastApp { color: var(--dim); font-size: 11px; }
  #toastSummary { font-weight: 650; }
  #toastBody { color: #ccc; }
  #toastSummary, #toastBody { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #open {
    position: absolute; inset: 0; padding: 8px 18px 16px; display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transform: scale(0.94) translateY(-6px); transform-origin: top center;
    transition: opacity 0.18s ease, transform 0.35s var(--smooth);
  }
  #notch.open #open { opacity: 1; pointer-events: auto; transform: none; transition: opacity 0.3s ease 0.1s, transform 0.5s var(--spring) 0.04s; }

  header { display: flex; align-items: center; height: 30px; flex: none; gap: 10px; }
  #tabs { display: flex; gap: 2px; background: rgba(255, 255, 255, 0.06); padding: 3px; border-radius: 10px; }
  .tab {
    min-width: 28px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px; transition: background 0.2s, color 0.2s, padding 0.25s var(--smooth);
  }
  .tab:hover { color: var(--text); }
  .tab svg { width: 13px; height: 13px; }
  .tab .tab-name { max-width: 0; overflow: hidden; opacity: 0; white-space: nowrap; font-weight: 600; transition: max-width 0.3s var(--smooth), opacity 0.2s, margin 0.3s; }
  .tab.active { background: rgba(255, 255, 255, 0.14); color: var(--text); padding: 0 9px 0 8px; }
  .tab.active .tab-name { max-width: 96px; opacity: 1; margin-inline-start: 5px; }
  #headerClock { flex: 1; display: flex; justify-content: center; align-items: baseline; gap: 7px; white-space: nowrap; cursor: pointer; }
  #headerClock .time { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #headerClock .date { font-size: 11.5px; font-weight: 500; color: var(--dim); }

  #battery { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #battery.hidden { display: none; }
  .battery-shell { position: relative; width: 25px; height: 12px; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 4px; padding: 2px; }
  .battery-shell::after { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: rgba(255, 255, 255, 0.5); }
  #batteryFill { height: 100%; width: 50%; border-radius: 1.5px; background: #fff; transition: width 0.5s ease, background 0.3s; }
  #battery.charging #batteryFill { background: var(--green); }
  #battery.low #batteryFill { background: var(--red); }

  #pages { flex: 1; min-height: 0; position: relative; }
  .tab-page { position: absolute; inset: 0; display: none; padding-top: 10px; }
  .tab-page.active { display: flex; animation: pageIn 0.35s var(--smooth); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } }
  #page-home { gap: 14px; }

  #music { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "art track" "bar bar" "ctl ctl"; align-items: center; column-gap: 12px; row-gap: 6px; }
  .art-wrap { grid-area: art; position: relative; width: 60px; height: 60px; }
  .art-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
  #art { z-index: 1; transition: transform 0.4s var(--spring), filter 0.3s; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5); }
  #art.paused { transform: scale(0.9); filter: brightness(0.75); }
  #artBlur { filter: blur(22px) saturate(1.8); opacity: 0; transform: scale(1.05); transition: opacity 0.6s ease; }
  #notch.playing #artBlur { opacity: 0.55; }
  .track { grid-area: track; min-width: 0; }
  #title { font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .progress-row { grid-area: bar; display: flex; align-items: center; gap: 8px; }
  .time-label { font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 28px; }
  #elapsed { text-align: right; }
  .progress { position: relative; flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); }
  .progress-fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: #fff; width: 0; }
  .controls { grid-area: ctl; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ctl { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background 0.2s, transform 0.15s; }
  .ctl:hover { background: var(--faint); }
  .ctl:active { transform: scale(0.9); }
  .ctl svg { width: 16px; height: 16px; }
  .ctl.big { width: 42px; height: 42px; }
  .ctl.big svg { width: 21px; height: 21px; }

  #weatherCard { width: 196px; flex: none; border-inline-start: 1px solid rgba(255, 255, 255, 0.06); padding-inline-start: 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
  #cardDay { font-weight: 650; font-size: 13px; }
  #cardCity { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 8px; }
  #cardTemp { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #cardCondition { color: var(--dim); font-size: 12px; }

  .brand { display: flex; align-items: center; gap: 6px; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 15px; background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; width: max-content; }
  .brand svg { width: 20px; height: 20px; fill: none; }
  #page-prayer { gap: 16px; align-items: stretch; }
  .prayer-next { width: 176px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
  .prayer-next .caption { color: var(--dim); font-size: 11px; margin-top: 8px; }
  #prayerName { font-family: "Outfit", sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1; }
  #prayerCountdown { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #prayerPlace { color: var(--dim); font-size: 11px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prayer-list { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .prayer-slot { border-radius: 14px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: background 0.3s, opacity 0.3s; }
  .prayer-slot .name { font-size: 10.5px; color: var(--dim); }
  .prayer-slot .time { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .prayer-slot.minor .time { font-weight: 500; color: var(--dim); }
  .prayer-slot.done { opacity: 0.45; }
  .prayer-slot.next { background: var(--brand-gradient); }
  .prayer-slot.next .name, .prayer-slot.next .time { color: #fff; }

  #page-calendar { gap: 18px; }
  .cal-box { width: 262px; flex: none; display: flex; flex-direction: column; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; height: 22px; font-weight: 650; font-size: 13px; text-transform: capitalize; }
  .cal-nav { width: 22px; height: 22px; border-radius: 7px; color: var(--dim); font-size: 15px; line-height: 1; }
  .cal-nav:hover { background: var(--faint); color: var(--text); }
  .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-weekdays span { text-align: center; font-size: 10px; color: var(--dim); line-height: 16px; }
  .cal-days { grid-auto-rows: 19px; }
  .cal-day { border-radius: 8px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .cal-day:hover { background: var(--faint); }
  .cal-day.outside { color: rgba(255, 255, 255, 0.3); }
  .cal-day.today { background: #fff; color: #000; font-weight: 700; }
  .cal-day.selected:not(.today) { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5); }
  .cal-detail { flex: 1; min-width: 0; border-inline-start: 1px solid rgba(255, 255, 255, 0.06); padding-inline-start: 18px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  #calBigDay { font-size: 44px; font-weight: 750; line-height: 1; letter-spacing: -1px; }
  #calWeekday { font-weight: 650; font-size: 14px; margin-top: 4px; }
  #calDate { color: var(--dim); font-size: 12px; }
  #calHijri { font-size: 12px; font-weight: 600; margin-top: 6px; background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; width: max-content; }
  .pill-btn { height: 24px; padding: 0 11px; border-radius: 12px; background: var(--faint); font-size: 11px; font-weight: 600; width: max-content; margin-top: 8px; transition: background 0.15s; }
  .pill-btn:hover { background: rgba(255, 255, 255, 0.14); }

  #page-notifications { flex-direction: column; gap: 8px; }
  .nf-head { display: flex; align-items: center; justify-content: space-between; font-weight: 650; font-size: 13px; }
  .nf-head .pill-btn { margin-top: 0; }
  #nfList { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; }
  #nfList::-webkit-scrollbar { display: none; }
  .nf-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--card); border-radius: 14px; flex: none; }
  .nf-icon { width: 28px; height: 28px; font-size: 12px; }
  .nf-main { min-width: 0; flex: 1; }
  .nf-top { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: var(--dim); }
  .nf-summary { font-size: 12.5px; font-weight: 650; }
  .nf-body { font-size: 11.5px; color: var(--dim); }
  .nf-summary, .nf-body { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nf-empty { flex: 1; display: grid; place-items: center; color: var(--dim); font-size: 12px; }
  .tab.unread::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .tab { position: relative; }
  #page-control { gap: 12px; align-items: stretch; }
  .sliders { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row svg { width: 14px; height: 14px; color: var(--dim); flex: none; }
  .slider-row input { flex: 1; accent-color: #fff; }
  .tiles { width: 196px; flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile {
    border-radius: 14px; background: var(--card); color: var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; font-size: 11px; font-weight: 600; transition: background 0.2s, color 0.2s, transform 0.12s;
  }
  .tile svg { width: 18px; height: 18px; }
  .tile:active { transform: scale(0.95); }
  .tile.on { background: #fff; color: #000; }

  #page-focus { align-items: center; justify-content: center; gap: 28px; }
  #focusInfo { display: flex; flex-direction: column; align-items: flex-start; }
  #focusPhase { font-size: 13px; font-weight: 700; color: var(--green); }
  #focusPhase.break { color: var(--yellow); }
  #focusTime { font-size: 40px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #focusRail { width: 220px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); margin-top: 10px; }
  #focusFill { height: 100%; width: 0; border-radius: 2px; background: var(--green); transition: width 1s linear; }
  #focusFill.break { background: var(--yellow); }
  .round-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--faint); transition: background 0.15s, transform 0.12s; }
  .round-btn:hover { background: rgba(255, 255, 255, 0.15); }
  .round-btn:active { transform: scale(0.9); }
  .round-btn svg { width: 12px; height: 12px; }
  .round-btn.big { width: 44px; height: 44px; background: #fff; color: #000; }
  .round-btn.big svg { width: 17px; height: 17px; }
  #focusButtons { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div id="notch" class="closed">
  <div class="ear left"></div>
  <div class="ear right"></div>
  <div id="glow"></div>

  <div id="closed">
    <img id="closedArt" alt="">
    <div class="gap"></div>
    <span id="closedTimer"></span>
    <div id="idleClock"></div>
  </div>

  <div id="toast">
    <div id="toastIcon"></div>
    <div class="toast-text">
      <div id="toastApp"></div>
      <div id="toastSummary"></div>
      <div id="toastBody"></div>
    </div>
  </div>

  <div id="open">
    <header>
      <nav id="tabs">
        <button class="tab active" data-tab="home" aria-label="Beranda"><svg viewBox="0 0 16 16"><path d="M6 12.5V4l7-1.5v8"/><circle cx="4.5" cy="12.5" r="2"/><circle cx="11.5" cy="11" r="2"/></svg><span class="tab-name">Beranda</span></button>
        <button class="tab" data-tab="calendar" aria-label="Kalender"><svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M3 3h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm.2 3.200v6.600h9.600V6.200zM4.800 1.500h1.400v2.300H4.800zM9.800 1.500h1.400v2.300H9.800z"/></svg><span class="tab-name">Kalender</span></button>
        <button class="tab" data-tab="prayer" aria-label="Shalat"><svg viewBox="0 0 16 16"><path d="M9.500 1.500a6.500 6.500 0 1 0 5 10.700A5.500 5.500 0 0 1 9.500 1.500z"/></svg><span class="tab-name">Shalat</span></button>
        <button class="tab" data-tab="notifications" aria-label="Notifikasi"><svg viewBox="0 0 16 16"><path d="M8 1.500a4 4 0 0 0-4 4v2.600L2.700 10.500V12h10.600v-1.500L12 8.100V5.500a4 4 0 0 0-4-4zM6.500 13h3a1.500 1.500 0 0 1-3 0z"/></svg><span class="tab-name">Notifikasi</span></button>
        <button class="tab" data-tab="control" aria-label="Kontrol"><svg viewBox="0 0 16 16"><path d="M2 4h7v1.6H2zM11 4h3v1.6h-3zM9 2.5h2v4.6H9zM2 10.4h3v1.6H2zM7 10.4h7V12H7zM5 8.9h2v4.6H5z"/></svg><span class="tab-name">Kontrol</span></button>
        <button class="tab" data-tab="focus" aria-label="Fokus"><svg viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 1.6a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zM7.2 4.8h1.6v3.4l2.2 1.3-.8 1.3-3-1.8z"/></svg><span class="tab-name">Fokus</span></button>
      </nav>
      <div id="headerClock"><span class="time"></span><span class="date"></span></div>
      <div id="battery" class="hidden">
        <span id="batteryPercent"></span>
        <div class="battery-shell"><div id="batteryFill"></div></div>
      </div>
    </header>

    <div id="pages">
      <section class="tab-page active" id="page-home">
        <div id="music">
          <div class="art-wrap">
            <img id="artBlur" alt="">
            <img id="art" alt="">
          </div>
          <div class="track">
            <div id="title">Tidak ada musik</div>
            <div id="artist"></div>
          </div>
          <div class="progress-row">
            <span class="time-label" id="elapsed">0:00</span>
            <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
            <span class="time-label" id="remaining">0:00</span>
          </div>
          <div class="controls">
            <button class="ctl" data-action="previous" aria-label="Sebelumnya"><svg viewBox="0 0 16 16"><path d="M3 3h1.8v10H3zM13 3v10L5.8 8z"/></svg></button>
            <button class="ctl big" data-action="play_pause" id="playPause" aria-label="Putar atau jeda"></button>
            <button class="ctl" data-action="next" aria-label="Berikutnya"><svg viewBox="0 0 16 16"><path d="M11.2 3H13v10h-1.8zM3 3l7.2 5L3 13z"/></svg></button>
          </div>
        </div>
        <div id="weatherCard">
          <div id="cardDay"></div>
          <div id="cardCity"></div>
          <div id="cardTemp"></div>
          <div id="cardCondition"></div>
        </div>
      </section>

      <section class="tab-page" id="page-calendar">
        <div class="cal-box">
          <div class="cal-head">
            <button class="cal-nav" id="calPrev" aria-label="Bulan sebelumnya">‹</button>
            <span id="calTitle"></span>
            <button class="cal-nav" id="calNext" aria-label="Bulan berikutnya">›</button>
          </div>
          <div class="cal-weekdays"></div>
          <div class="cal-days" id="calDays"></div>
        </div>
        <div class="cal-detail">
          <div id="calBigDay"></div>
          <div id="calWeekday"></div>
          <div id="calDate"></div>
          <div id="calHijri"></div>
          <button class="pill-btn" id="calToday">Hari ini</button>
        </div>
      </section>

      <section class="tab-page" id="page-prayer">
        <div class="prayer-next">
          <div class="brand"><svg viewBox="30 30 80 80"><defs><linearGradient id="bellGradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2db1b3"/><stop offset="1" stop-color="#7ac793"/></linearGradient></defs><path d="M46.700 63A23.300 23.300 0 0 1 93.300 63v9.300a4.700 4.700 0 0 1-4.700 4.700H51.300a4.700 4.700 0 0 1-4.600-4.700z" fill="url(#bellGradient)"/><rect x="42" y="77" width="56" height="7" rx="3.500" fill="url(#bellGradient)"/><circle cx="70" cy="92.200" r="8.200" fill="#7ac793"/></svg>tanbih</div>
          <div class="caption">Berikutnya</div>
          <div id="prayerName"></div>
          <div id="prayerCountdown"></div>
          <div id="prayerPlace"></div>
        </div>
        <div class="prayer-list" id="prayerList"></div>
      </section>

      <section class="tab-page" id="page-notifications">
        <div class="nf-head"><span>Notifikasi</span><button class="pill-btn" id="nfClear">Hapus semua</button></div>
        <div id="nfList"></div>
      </section>

      <section class="tab-page" id="page-control">
        <div class="sliders">
          <div class="slider-row">
            <svg viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2zM10.2 5.2a4 4 0 0 1 0 5.6l-1-1a2.6 2.6 0 0 0 0-3.6z"/></svg>
            <input id="volume" type="range" min="0" max="100" aria-label="Volume">
          </div>
          <div class="slider-row">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M7.3 1h1.4v2H7.3zM7.3 13h1.4v2H7.3zM1 7.3h2v1.4H1zM13 7.3h2v1.4h-2z"/></svg>
            <input id="brightness" type="range" min="5" max="100" aria-label="Kecerahan">
          </div>
        </div>
        <div class="tiles">
          <button class="tile" id="wifi"><svg viewBox="0 0 16 16"><path d="M8 12.8a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zM3.8 8.4a6 6 0 0 1 8.4 0l-1 1a4.6 4.6 0 0 0-6.4 0zM1.2 5.8a9.7 9.7 0 0 1 13.6 0l-1 1a8.3 8.3 0 0 0-11.6 0z"/></svg>Wi-Fi</button>
          <button class="tile" id="bluetooth"><svg viewBox="0 0 16 16"><path d="M7.2 1.5v5.1L4.7 4.1l-.9.9L6.8 8l-3 3 .9.9 2.5-2.5v5.1L11.6 11 9.2 8l2.4-3zm1.3 3 1.2 1.2-1.2 1.2zm0 5.8 1.2 1.2-1.2 1.2z"/></svg>Bluetooth</button>
        </div>
      </section>

      <section class="tab-page" id="page-focus">
        <div id="focusInfo">
          <span id="focusPhase"></span>
          <span id="focusTime"></span>
          <div id="focusRail"><div id="focusFill"></div></div>
        </div>
        <div id="focusButtons">
          <button class="round-btn big" id="focusToggle" aria-label="Mulai atau jeda"></button>
          <button class="round-btn" id="focusReset" aria-label="Atur ulang"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 0 5.2 7.3h-1.7A3.9 3.9 0 1 1 8 4.1c1 0 1.8.4 2.5 1L8.7 7H14V1.7l-1.9 1.9A5.5 5.5 0 0 0 8 2.5z"/></svg></button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const notch = document.getElementById('notch');
  const root = document.documentElement;
  const byId = (id) => document.getElementById(id);

  const SIZES = {
    closed: { width: 200, height: 32, radius: 12 },
    notify: { width: 380, height: 64, radius: 22 },
    open: { width: 560, height: 220, radius: 28 },
    away: { width: 0, height: 0, radius: 0 },
  };
  const TOAST_DURATION_MS = 5000;
  const DASHBOARD_REFRESH_MS = 5000;
  const CLOCK_REFRESH_MS = 1000;
  const MS_PER_MINUTE = 60 * 1000;
  const MICROSECONDS_PER_SECOND = 1e6;
  const LOW_BATTERY_PERCENT = 20;
  const WEATHER_TTL_MS = 15 * 60 * 1000;
  const FALLBACK_LOCATION = { latitude: -6.2, longitude: 106.8, city: 'Jakarta' };
  const GEOLOCATION_URL = 'https://ipwho.is/';
  const WEATHER_LABELS = [
    [0, 'Cerah'], [3, 'Berawan'], [48, 'Berkabut'], [67, 'Hujan'],
    [77, 'Salju'], [82, 'Hujan lebat'], [99, 'Badai'],
  ];
  const POMODORO_PHASES = {
    focus: { label: 'Fokus', minutes: 25, next: 'break', doneMessage: 'Waktu istirahat' },
    break: { label: 'Istirahat', minutes: 5, next: 'focus', doneMessage: 'Kembali fokus' },
  };
  const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
  const DEFAULT_ART = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2c2e"/><stop offset="1" stop-color="#1c1c1e"/></linearGradient></defs><rect width="84" height="84" fill="url(#g)"/><path d="M34 58V30l22-5v26" fill="none" stroke="#8e8e93" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="58" r="6" fill="#8e8e93"/><circle cx="51" cy="51" r="6" fill="#8e8e93"/></svg>');

  let isAway = false;
  let toastTimer;

  const currentState = () => {
    if (isAway) return 'away';
    if (notch.classList.contains('open')) return 'open';
    if (notch.classList.contains('notify')) return 'notify';
    return 'closed';
  };

  const applyState = () => {
    const { width, height, radius } = SIZES[currentState()];
    root.style.setProperty('--w', `${width}px`);
    root.style.setProperty('--h', `${height}px`);
    root.style.setProperty('--r', `${radius}px`);
    invoke('set_hit_rect', { x: Math.round((window.innerWidth - width) / 2), y: 0, width, height });
  };

  const hideToast = () => {
    notch.classList.remove('notify');
    applyState();
  };

  const showToast = (appName, summary, body) => {
    if (isAway || notch.classList.contains('open')) return;
    byId('toastIcon').textContent = appInitial(appName);
    byId('toastIcon').classList.toggle('brand', appName === BRAND_APP_NAME);
    byId('toastApp').textContent = appName;
    byId('toastSummary').textContent = summary;
    byId('toastBody').textContent = body;
    notch.classList.add('notify');
    applyState();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, TOAST_DURATION_MS);
  };

  const BRAND_APP_NAME = 'Tanbih';
  const NOTIFICATION_HISTORY_LIMIT = 30;
  const notifications = [];
  const appInitial = (appName) => (appName || '?').trim().charAt(0).toUpperCase();
  const isNotificationsVisible = () => notch.classList.contains('open') && byId('page-notifications').classList.contains('active');

  const markNotificationsRead = () => document.querySelector('.tab[data-tab="notifications"]').classList.remove('unread');

  const renderNotifications = () => {
    const list = byId('nfList');
    list.replaceChildren();
    if (!notifications.length) {
      const empty = document.createElement('div');
      empty.className = 'nf-empty';
      empty.textContent = 'Belum ada notifikasi';
      list.append(empty);
      return;
    }
    notifications.forEach((entry) => {
      const item = document.createElement('div');
      item.className = 'nf-item';
      const icon = document.createElement('div');
      icon.className = entry.appName === BRAND_APP_NAME ? 'nf-icon brand' : 'nf-icon';
      icon.textContent = appInitial(entry.appName);
      const main = document.createElement('div');
      main.className = 'nf-main';
      const top = document.createElement('div');
      top.className = 'nf-top';
      const app = document.createElement('span');
      app.textContent = entry.appName;
      const time = document.createElement('span');
      time.textContent = entry.at.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      top.append(app, time);
      const summary = document.createElement('div');
      summary.className = 'nf-summary';
      summary.textContent = entry.summary;
      const body = document.createElement('div');
      body.className = 'nf-body';
      body.textContent = entry.body;
      main.append(top, summary, body);
      item.append(icon, main);
      list.append(item);
    });
  };

  const notify = (appName, summary, body) => {
    notifications.unshift({ appName, summary, body, at: new Date() });
    notifications.length = Math.min(notifications.length, NOTIFICATION_HISTORY_LIMIT);
    if (!isNotificationsVisible()) document.querySelector('.tab[data-tab="notifications"]').classList.add('unread');
    renderNotifications();
    showToast(appName, summary, body);
  };

  byId('nfClear').addEventListener('click', () => {
    notifications.length = 0;
    renderNotifications();
  });

  const closeNotch = () => {
    notch.classList.remove('open');
    applyState();
  };

  listen('fullscreen', (event) => {
    isAway = event.payload;
    document.body.classList.toggle('away', isAway);
    clearTimeout(toastTimer);
    notch.classList.remove('notify');
    applyState();
  });
  listen('notification', (event) => notify(event.payload.app_name, event.payload.summary, event.payload.body));

  notch.addEventListener('click', () => {
    if (notch.classList.contains('open')) return;
    clearTimeout(toastTimer);
    notch.classList.remove('notify');
    notch.classList.add('open');
    applyState();
    refreshDashboard();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeNotch();
  });
  byId('headerClock').addEventListener('click', (event) => {
    event.stopPropagation();
    closeNotch();
  });
  byId('open').addEventListener('click', (event) => event.stopPropagation());

  const selectTab = (tabName) => {
    document.querySelectorAll('.tab, .tab-page').forEach((element) => element.classList.remove('active'));
    document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
    byId(`page-${tabName}`).classList.add('active');
    if (tabName === 'notifications') markNotificationsRead();
  };
  document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => selectTab(tab.dataset.tab)));

  const pad2 = (value) => String(value).padStart(2, '0');
  const formatClock = (milliseconds) => {
    const totalSeconds = Math.ceil(milliseconds / 1000);
    return `${pad2(Math.floor(totalSeconds / 60))}:${pad2(totalSeconds % 60)}`;
  };
  const formatTrackTime = (microseconds) => {
    const totalSeconds = Math.max(0, Math.floor(microseconds / MICROSECONDS_PER_SECOND));
    return `${Math.floor(totalSeconds / 60)}:${pad2(totalSeconds % 60)}`;
  };
  const weatherLabel = (code) => (WEATHER_LABELS.find(([maxCode]) => code <= maxCode) || [0, ''])[1];

  const refreshClock = () => {
    const now = new Date();
    const time = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    byId('idleClock').textContent = time;
    document.querySelector('#headerClock .time').textContent = time;
    document.querySelector('#headerClock .date').textContent = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
    byId('cardDay').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
  };

  let locationPromise;
  const resolveLocation = () => locationPromise ||= fetch(GEOLOCATION_URL)
    .then((response) => response.json())
    .then((data) => (data.success ? { latitude: data.latitude, longitude: data.longitude, city: data.city } : FALLBACK_LOCATION))
    .catch(() => FALLBACK_LOCATION);
  let weatherFetchedAt = 0;

  const refreshWeather = async () => {
    if (Date.now() - weatherFetchedAt < WEATHER_TTL_MS) return;
    try {
      const { latitude, longitude, city } = await resolveLocation();
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`;
      const { current } = await (await fetch(url)).json();
      byId('cardCity').textContent = city;
      byId('cardTemp').textContent = `${Math.round(current.temperature_2m)}°`;
      byId('cardCondition').textContent = weatherLabel(current.weather_code);
      weatherFetchedAt = Date.now();
    } catch (error) {
      ['cardCity', 'cardTemp', 'cardCondition'].forEach((id) => { byId(id).textContent = ''; });
    }
  };

  const refreshBattery = async () => {
    const battery = await invoke('battery_status');
    const element = byId('battery');
    element.classList.toggle('hidden', !battery);
    if (!battery) return;
    element.classList.toggle('charging', battery.charging);
    element.classList.toggle('low', battery.percent <= LOW_BATTERY_PERCENT && !battery.charging);
    byId('batteryPercent').textContent = `${battery.percent}%`;
    byId('batteryFill').style.width = `${battery.percent}%`;
  };

  const refreshSlider = async (id, command, toPercent) => {
    const slider = byId(id);
    if (slider === document.activeElement) return;
    try {
      const value = await invoke(command);
      if (value === null) slider.disabled = true;
      else slider.value = toPercent(value);
    } catch (error) {
      slider.disabled = true;
    }
  };

  const refreshRadios = async () => {
    const radios = await invoke('radio_status');
    byId('wifi').classList.toggle('on', radios.wifi);
    byId('bluetooth').classList.toggle('on', radios.bluetooth);
  };

  const refreshDashboard = () => {
    refreshWeather();
    refreshBattery();
    refreshRadios();
    refreshSlider('volume', 'volume_get', (volume) => volume.percent);
    refreshSlider('brightness', 'brightness_get', (percent) => percent);
  };

  byId('volume').addEventListener('change', (event) => invoke('volume_set', { percent: Number(event.target.value) }));
  byId('brightness').addEventListener('change', (event) => invoke('brightness_set', { percent: Number(event.target.value) }));
  [['wifi', 'wifi_set'], ['bluetooth', 'bluetooth_set']].forEach(([id, command]) => {
    const tile = byId(id);
    tile.addEventListener('click', async () => {
      await invoke(command, { enabled: !tile.classList.contains('on') });
      refreshRadios();
    });
  });

  let pomodoro = { phase: 'focus', remainingMs: POMODORO_PHASES.focus.minutes * MS_PER_MINUTE, endsAt: null };

  const renderPomodoro = () => {
    const phase = POMODORO_PHASES[pomodoro.phase];
    const isBreak = pomodoro.phase === 'break';
    const isRunning = pomodoro.endsAt !== null;
    byId('focusPhase').textContent = phase.label;
    byId('focusPhase').classList.toggle('break', isBreak);
    byId('focusTime').textContent = formatClock(pomodoro.remainingMs);
    byId('focusFill').classList.toggle('break', isBreak);
    byId('focusFill').style.width = `${(1 - pomodoro.remainingMs / (phase.minutes * MS_PER_MINUTE)) * 100}%`;
    byId('focusToggle').innerHTML = isRunning ? ICON_PAUSE : ICON_PLAY;
    byId('closedTimer').textContent = formatClock(pomodoro.remainingMs);
    notch.classList.toggle('timing', isRunning);
  };

  const resetPhase = (phaseName) => {
    pomodoro = { phase: phaseName, remainingMs: POMODORO_PHASES[phaseName].minutes * MS_PER_MINUTE, endsAt: null };
  };

  const tickPomodoro = () => {
    if (!pomodoro.endsAt) return;
    pomodoro.remainingMs = pomodoro.endsAt - Date.now();
    if (pomodoro.remainingMs <= 0) {
      const finished = POMODORO_PHASES[pomodoro.phase];
      resetPhase(finished.next);
      notify('Pomodoro', `${finished.label} selesai`, finished.doneMessage);
    }
    renderPomodoro();
  };

  byId('focusToggle').addEventListener('click', () => {
    pomodoro.endsAt = pomodoro.endsAt ? null : Date.now() + pomodoro.remainingMs;
    renderPomodoro();
  });
  byId('focusReset').addEventListener('click', () => {
    resetPhase('focus');
    renderPomodoro();
  });

  document.querySelectorAll('.controls .ctl').forEach((button) => {
    button.addEventListener('click', () => invoke('media_control', { action: button.dataset.action }));
  });

  const render = (media) => {
    const artUrl = media && media.art_url ? media.art_url : DEFAULT_ART;
    ['art', 'artBlur', 'closedArt'].forEach((id) => { byId(id).src = artUrl; });
    byId('title').textContent = media ? media.title || 'Tanpa judul' : 'Tidak ada musik';
    byId('artist').textContent = media ? media.artist : '';
    byId('playPause').innerHTML = media && media.playing ? ICON_PAUSE : ICON_PLAY;
    byId('art').classList.toggle('paused', !!media && !media.playing);
    notch.classList.toggle('playing', !!media && media.playing);
    const length = media ? media.length_us : 0;
    const position = media ? media.position_us : 0;
    byId('progressFill').style.width = length ? `${Math.min(100, (position / length) * 100)}%` : '0%';
    byId('elapsed').textContent = formatTrackTime(position);
    byId('remaining').textContent = formatTrackTime(Math.max(0, length - position));
  };

  const WEEKDAYS_SHORT = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  const CALENDAR_CELLS = 42;
  const DAYS_PER_WEEK = 7;
  const hijriFormatter = new Intl.DateTimeFormat('id-u-ca-islamic-civil', { day: 'numeric', month: 'long', year: 'numeric' });
  const isSameDay = (first, second) => first.toDateString() === second.toDateString();
  let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let selectedDate = new Date();

  const renderCalendarDetail = () => {
    byId('calBigDay').textContent = selectedDate.getDate();
    byId('calWeekday').textContent = selectedDate.toLocaleDateString('id-ID', { weekday: 'long' });
    byId('calDate').textContent = selectedDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    byId('calHijri').textContent = hijriFormatter.format(selectedDate);
  };

  const renderCalendar = () => {
    byId('calTitle').textContent = calendarMonth.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    const leadingDays = (calendarMonth.getDay() + DAYS_PER_WEEK - 1) % DAYS_PER_WEEK;
    const today = new Date();
    const days = byId('calDays');
    days.replaceChildren();
    for (let index = 0; index < CALENDAR_CELLS; index++) {
      const date = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth(), 1 - leadingDays + index);
      const cell = document.createElement('button');
      cell.className = 'cal-day';
      cell.textContent = date.getDate();
      cell.classList.toggle('outside', date.getMonth() !== calendarMonth.getMonth());
      cell.classList.toggle('today', isSameDay(date, today));
      cell.classList.toggle('selected', isSameDay(date, selectedDate));
      cell.addEventListener('click', () => {
        selectedDate = date;
        calendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        renderCalendar();
      });
      days.append(cell);
    }
    renderCalendarDetail();
  };

  const shiftCalendarMonth = (delta) => {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + delta, 1);
    renderCalendar();
  };
  byId('calPrev').addEventListener('click', () => shiftCalendarMonth(-1));
  byId('calNext').addEventListener('click', () => shiftCalendarMonth(1));
  byId('calToday').addEventListener('click', () => {
    selectedDate = new Date();
    calendarMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
    renderCalendar();
  });
  const weekdayHeader = document.querySelector('.cal-weekdays');
  WEEKDAYS_SHORT.forEach((name) => {
    const label = document.createElement('span');
    label.textContent = name;
    weekdayHeader.append(label);
  });

  const MINUTES_PER_DAY = 24 * 60;
  const SECONDS_PER_MINUTE = 60;
  const PRAYER_SLOTS = [
    { key: 'fajr', label: 'Subuh' },
    { key: 'sunrise', label: 'Terbit', minor: true },
    { key: 'dhuhr', label: 'Dzuhur' },
    { key: 'asr', label: 'Ashar' },
    { key: 'maghrib', label: 'Maghrib' },
    { key: 'isha', label: 'Isya' },
  ];
  const PRAYERS = PRAYER_SLOTS.filter((slot) => !slot.minor);
  let prayerSchedule = null;
  let notifiedPrayers = new Set();

  const formatMinutesOfDay = (minutes) => {
    const wholeMinutes = Math.round(minutes) % MINUTES_PER_DAY;
    return `${pad2(Math.floor(wholeMinutes / 60))}:${pad2(wholeMinutes % 60)}`;
  };
  const formatCountdown = (seconds) => {
    const total = Math.max(0, Math.ceil(seconds));
    return `${Math.floor(total / 3600)}:${pad2(Math.floor((total % 3600) / 60))}:${pad2(total % 60)}`;
  };
  const minutesNow = (now) => now.getHours() * 60 + now.getMinutes() + now.getSeconds() / SECONDS_PER_MINUTE;

  const buildPrayerList = () => {
    const list = byId('prayerList');
    list.replaceChildren();
    PRAYER_SLOTS.forEach((slot) => {
      const element = document.createElement('div');
      element.className = slot.minor ? 'prayer-slot minor' : 'prayer-slot';
      element.dataset.key = slot.key;
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = slot.label;
      const time = document.createElement('span');
      time.className = 'time';
      element.append(name, time);
      list.append(element);
    });
  };

  const nextPrayer = (times, now) => {
    const upcoming = PRAYERS.find((slot) => times[slot.key] > now);
    if (upcoming) return { slot: upcoming, minutes: times[upcoming.key] };
    // shortcut: tomorrow's Subuh is today's shifted by a day, off by about a minute, fine for a countdown
    return { slot: PRAYERS[0], minutes: times.fajr + MINUTES_PER_DAY };
  };

  const renderPrayer = () => {
    if (!prayerSchedule) return;
    const { times, city } = prayerSchedule;
    const now = minutesNow(new Date());
    const next = nextPrayer(times, now);
    byId('prayerName').textContent = next.slot.label;
    byId('prayerCountdown').textContent = formatCountdown((next.minutes - now) * SECONDS_PER_MINUTE);
    byId('prayerPlace').textContent = `${city} · ${formatMinutesOfDay(next.minutes)}`;
    byId('prayerList').querySelectorAll('.prayer-slot').forEach((element) => {
      const { key } = element.dataset;
      element.querySelector('.time').textContent = formatMinutesOfDay(times[key]);
      element.classList.toggle('next', key === next.slot.key);
      element.classList.toggle('done', times[key] <= now && key !== next.slot.key);
    });
  };

  const loadPrayer = async () => {
    const { latitude, longitude, city } = await resolveLocation();
    const now = new Date();
    const times = await invoke('prayer_times_for_day', {
      latitude, longitude, year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate(), utcOffsetMinutes: -now.getTimezoneOffset(),
    });
    if (!times) return;
    prayerSchedule = { dayKey: now.toDateString(), times, city };
    notifiedPrayers = new Set(PRAYERS.filter((slot) => times[slot.key] <= minutesNow(now)).map((slot) => slot.key));
    renderPrayer();
  };

  const tickPrayer = () => {
    if (!prayerSchedule) return;
    if (prayerSchedule.dayKey !== new Date().toDateString()) {
      loadPrayer();
      return;
    }
    const now = minutesNow(new Date());
    PRAYERS.filter((slot) => !notifiedPrayers.has(slot.key) && prayerSchedule.times[slot.key] <= now).forEach((slot) => {
      notifiedPrayers.add(slot.key);
      notify(BRAND_APP_NAME, `Waktu ${slot.label}`, `${prayerSchedule.city} · ${formatMinutesOfDay(prayerSchedule.times[slot.key])}`);
    });
    renderPrayer();
  };

  buildPrayerList();
  renderCalendar();
  renderNotifications();
  loadPrayer();
  setInterval(tickPrayer, CLOCK_REFRESH_MS);

  listen('media', (event) => render(event.payload));
  render(null);
  renderPomodoro();
  refreshClock();
  applyState();
  setInterval(refreshClock, CLOCK_REFRESH_MS);
  setInterval(tickPomodoro, CLOCK_REFRESH_MS);
  setInterval(() => { if (notch.classList.contains('open')) refreshDashboard(); }, DASHBOARD_REFRESH_MS);
</script>
